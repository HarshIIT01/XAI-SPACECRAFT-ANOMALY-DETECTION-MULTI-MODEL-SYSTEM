<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Spacecraft Anomaly Detection{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/static/styles.css" rel="stylesheet" />
  </head>
  <body class="bg-body">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">
          <i class="bi bi-rocket-takeoff me-2"></i>Spacecraft Anomaly Detection
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Overview</a></li>
            <li class="nav-item"><a class="nav-link" href="/run"><i class="bi bi-play-circle me-1"></i>Run Pipeline</a></li>
            <li class="nav-item"><a class="nav-link" href="/results"><i class="bi bi-file-earmark-text me-1"></i>Results</a></li>
            <li class="nav-item">
              <a class="nav-link" href="/docs" target="_blank" rel="noreferrer"><i class="bi bi-code-square me-1"></i>API</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      {% block content %}{% endblock %}
    </main>

    <footer class="border-top bg-light py-4 mt-5">
      <div class="container">
        <div class="row">
          <div class="col-md-6">
            <div class="small text-muted">
              <div class="fw-semibold mb-1">Spacecraft Anomaly Detection</div>
              <p class="mb-0">Explainable multi-model anomaly detection for spacecraft telemetry</p>
            </div>
          </div>
          <div class="col-md-6 text-md-end">
            <div class="small text-muted">
              Built with FastAPI · Jinja2 · Bootstrap
            </div>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
  </body>
</html>
