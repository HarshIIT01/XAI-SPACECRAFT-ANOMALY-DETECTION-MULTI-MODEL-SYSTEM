[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spacecraft-anomaly"
version = "0.1.0"
description = "Explainable multi-model spacecraft telemetry anomaly detection"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
